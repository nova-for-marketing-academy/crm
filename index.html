<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA Student CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --ink-2:#4a4a4a; --ink-3:#7a7a7a;
  --paper:#ffffff; --bg:#f2f2f0; --line:#e1e1de; --line-2:#cfcfcb;
  --red:#d3121c; --red-ink:#ffffff; --red-soft:#fdeaea;
  --side:#000000; --side-ink:#f1f1f1; --side-dim:#9a9a9a;
  --ok:#17794a; --ok-soft:#e5f4ec; --warn:#9a6200; --warn-soft:#fff2d9; --info:#1f5a99; --info-soft:#e6f0fb;
  --r-sm:6px; --r:10px; --r-lg:16px;
  --f-head:'Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f1f1ef; --ink-2:#c3c3c0; --ink-3:#8f8f8c; --paper:#1a1a1a; --bg:#101010; --line:#2c2c2b; --line-2:#3c3c3a;
    --red:#ef3a43; --red-soft:#3a1517; --ok:#4cc38a; --ok-soft:#14291f; --warn:#e8b04a; --warn-soft:#322815; --info:#6fb0f0; --info-soft:#14243a; --side:#000;
  }
}
:root[data-theme="dark"]{
  --ink:#f1f1ef; --ink-2:#c3c3c0; --ink-3:#8f8f8c; --paper:#1a1a1a; --bg:#101010; --line:#2c2c2b; --line-2:#3c3c3a;
  --red:#ef3a43; --red-soft:#3a1517; --ok:#4cc38a; --ok-soft:#14291f; --warn:#e8b04a; --warn-soft:#322815; --info:#6fb0f0; --info-soft:#14243a; --side:#000;
}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.4;font-weight:700}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .small{font-size:13px} .nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:flex;min-height:100%}
.side{width:248px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{padding:22px 20px 18px;border-bottom:1px solid #1f1f1f}
.brand b{display:block;font-family:var(--f-head);font-size:30px;letter-spacing:.5px;line-height:1;color:#fff}
.brand b i{font-style:normal;color:var(--red)}
.brand span{display:block;margin-top:6px;font-size:11.5px;color:var(--side-dim)}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--side-dim);text-decoration:none;font-size:14.5px;border-inline-start:3px solid transparent}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{color:#fff;background:#141414}
.nav a[aria-current=page]{color:#fff;background:#1a1a1a;border-inline-start-color:var(--red)}
.nav .badge{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11.5px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{padding:14px 16px;border-top:1px solid #1f1f1f;font-size:13px}
.side-foot .who{color:#fff;font-weight:600}
.side-foot button{margin-top:8px;background:none;border:1px solid #333;color:var(--side-ink);border-radius:var(--r-sm);padding:5px 12px;cursor:pointer;width:100%}
.side-foot button:hover{border-color:var(--red)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.demo-bar{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);padding:6px 20px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-bar b{font-weight:700}
.topbar{display:none}
.content{padding:24px 28px 60px;max-width:1500px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:2px 0 0;color:var(--ink-3);font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* components */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card + .card{margin-top:16px}
.card h2{margin-bottom:12px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-size:13px;color:var(--ink-2)}
.kpi .v{font-family:var(--f-head);font-size:28px;font-weight:700;line-height:1.3;margin-top:2px}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi.alert .v{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:7px 15px;border-radius:var(--r-sm);cursor:pointer;text-decoration:none;font-size:14px;line-height:1.5}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.93)}
.btn.dark{background:#000;border-color:#000;color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;border:1px solid var(--line-2);background:var(--bg);white-space:nowrap}
.tag.new{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.contacted,.tag.interested{background:#eef0ff;color:#3b4aa8;border-color:transparent}
.tag.follow_up{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.registration_pending{background:#fbe9f3;color:#a3216a;border-color:transparent}
.tag.converted,.tag.confirmed,.tag.paid{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.lost,.tag.cancelled,.tag.overdue,.tag.refunded{background:var(--red-soft);color:var(--red);border-color:transparent}
.tag.nurture,.tag.pending,.tag.partially_paid{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.high{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.low{background:var(--bg);color:var(--ink-3)}
.tag.medium{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.alert-box{border-radius:var(--r-sm);padding:10px 14px;font-size:14px;border:1px solid}
.alert-box.err{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.alert-box.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.alert-box.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.alert-box.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.empty{text-align:center;padding:38px 16px;color:var(--ink-3)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .actions{justify-content:center;margin-top:14px}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;color:var(--ink-2);font-weight:600}
.fld label .req{color:var(--red)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=datetime-local],input[type=file],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r-sm);padding:7px 10px;min-height:38px}
input[type=tel],input[type=email],input[type=number],input[type=date],input[type=datetime-local]{direction:ltr;text-align:right}
textarea{min-height:76px;resize:vertical}
.fld .err{color:var(--red);font-size:12.5px;min-height:0}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.hint{font-size:12.5px;color:var(--ink-3)}
.form-foot{display:flex;gap:8px;justify-content:flex-start;margin-top:14px;align-items:center;flex-wrap:wrap}
.form-err{margin-top:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.filters.wide{grid-template-columns:2fr repeat(auto-fit,minmax(140px,1fr))}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--bg);font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
th button{background:none;border:0;cursor:pointer;font-weight:600;font-size:13px;color:inherit;padding:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
td select{min-height:30px;padding:2px 6px;font-size:13px;width:auto}
.cell-name b{display:block}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.over{color:var(--red);font-weight:600}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:130px 1fr 74px;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--red);border-radius:99px;min-width:2px}
.bar-fill.k{background:var(--ink)}
.bar-row .val{text-align:end}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 16px;cursor:pointer;color:var(--ink-3);font-weight:600;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
.tabs .cnt{font-size:12px;background:var(--bg);border-radius:99px;padding:0 7px;margin-inline-start:5px}

/* lead header */
.lead-head{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:13px}
.pill b{display:block;font-size:14.5px}
.pill.hot{border-color:var(--red);background:var(--red-soft)}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 22px 18px 0;border-inline-start:0}
.timeline li::before{content:"";position:absolute;right:5px;top:8px;bottom:-8px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline li::after{content:"";position:absolute;right:0;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--red)}
.tl-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-3)}
.tl-body{margin-top:3px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
.kv div span{display:block;font-size:12.5px;color:var(--ink-3)}
.sec-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sec-tabs button{border:1px solid var(--line-2);background:var(--paper);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:13.5px}
.sec-tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sec-tabs button.hot[aria-selected=false]{border-color:var(--red);color:var(--red)}

/* dialog + toast */
dialog{border:0;border-radius:var(--r-lg);padding:0;background:var(--paper);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.sm{width:min(440px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:18px;overflow-y:auto;max-height:calc(92vh - 62px)}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3)}
#toasts{position:fixed;inset-inline-end:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99;max-width:min(420px,calc(100vw - 32px))}
.toast{background:#000;color:#fff;padding:10px 16px;border-radius:var(--r-sm);border-inline-start:4px solid var(--ok);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast.err{border-inline-start-color:var(--red)}
.loading{padding:50px;text-align:center;color:var(--ink-3)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-inline-end:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:#000;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-art .big{font-family:var(--f-head);font-size:clamp(64px,11vw,128px);font-weight:900;line-height:.95;letter-spacing:-1px}
.login-art .big i{font-style:normal;color:var(--red)}
.login-art p{max-width:380px;color:#bdbdbd}
.login-form{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:520px}
.acct{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);cursor:pointer}
.acct:hover:not([disabled]){border-color:var(--red)}
.acct[disabled]{opacity:.5;cursor:not-allowed}
.mob-only{display:none}

@media (max-width:980px){
  .side{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transform:translateX(100%);transition:transform .2s;width:270px}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .topbar{display:flex;align-items:center;gap:12px;background:#000;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:40}
  .topbar b{font-family:var(--f-head);font-size:20px}.topbar b i{font-style:normal;color:var(--red)}
  .topbar button{background:none;border:1px solid #333;color:#fff;border-radius:6px;padding:4px 10px;font-size:18px}
  .content{padding:16px 14px 70px}
  .login{grid-template-columns:1fr}.login-art{padding:28px;min-height:200px}.login-form{padding:24px;max-width:none}
  .bar-row{grid-template-columns:96px 1fr 62px}
  .mob-only{display:block}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

</style>
</head>

(function (root) {

const GOVERNORATES = ['القاهرة','الجيزة','الإسكندرية','القليوبية','الشرقية','الدقهلية','الغربية','المنوفية','البحيرة','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','مطروح'];

const ACTIVE_FOLLOW = ['new', 'contacted', 'interested', 'follow_up', 'registration_pending'];
const TRANSITIONS = {
  new: ['contacted', 'interested', 'follow_up', 'lost', 'nurture'],
  contacted: ['interested', 'follow_up', 'registration_pending', 'lost', 'nurture'],
  interested: ['contacted', 'follow_up', 'registration_pending', 'lost', 'nurture'],
  follow_up: ['contacted', 'interested', 'registration_pending', 'lost', 'nurture'],

const canTransition = (from, to) => from === to || (TRANSITIONS[from] || []).includes(to);

/* ───────────── Helpers ───────────── */
const uuid = () => (root.crypto && root.crypto.randomUUID) ? root.crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const ERR = (code, message, extra) => Object.assign(new Error(message), { code, ar: message }, extra || {});
const round2 = x => Math.round(Number(x) * 100) / 100;
const pct = (a, b) => b > 0 ? Math.round((a / b) * 1000) / 10 : null;
const median = arr => { if (!arr.length) return null; const s = arr.slice().sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const normText = s => String(s || '').toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim();
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function normalizePhone(raw) {
  if (raw == null) return { ok: false, reason: 'empty' };
  let s = String(raw).trim();
  const ar = '٠١٢٣٤٥٦٧٨٩', fa = '۰۱۲۳۴۵۶۷۸۹';
  s = s.replace(/[٠-٩]/g, d => ar.indexOf(d)).replace(/[۰-۹]/g, d => fa.indexOf(d));
  if (!s) return { ok: false, reason: 'empty' };
  const plus = s.startsWith('+'), zeros = s.startsWith('00');
  let d = s.replace(/\D/g, '');
  if (!d) return { ok: false, reason: 'invalid' };
  const eg = n => {
    if (/^1[0125]\d{8}$/.test(n)) return { ok: true, normalized: '+20' + n, kind: 'eg_mobile' };
    if (/^[2-9]\d{7,8}$/.test(n)) return { ok: true, normalized: '+20' + n, kind: 'eg_landline' };
    return { ok: false, reason: 'invalid' };
  };
  if (plus || zeros) {
    if (zeros) d = d.slice(2);
    if (d.startsWith('20')) { let n = d.slice(2); if (n.startsWith('0')) n = n.slice(1); return eg(n); }
    if (d.length >= 8 && d.length <= 15 && d[0] !== '0') return { ok: true, normalized: '+' + d, kind: 'intl' };
    return { ok: false, reason: 'invalid' };
  }
  if (d.startsWith('20') && d.length === 12 && d[2] === '1') return eg(d.slice(2));
  if (d.startsWith('0')) return eg(d.slice(1));
  if (d.length === 10 && d[0] === '1') return eg(d);
  return { ok: false, reason: 'invalid' };
}
function displayPhone(norm) {
  if (!norm) return '';
  if (/^\+201[0125]\d{8}$/.test(norm)) { const n = norm.slice(3); return '0' + n.slice(0, 2) + ' ' + n.slice(2, 6) + ' ' + n.slice(6); }
  if (norm.startsWith('+20')) return '0' + norm.slice(3);
  return norm;
}

/* Dates: inputs are ISO strings or "YYYY-MM-DDTHH:mm" (local). */
function toISO(v) { if (v == null || v === '') return null; const d = new Date(v); return isNaN(d) ? undefined : d.toISOString(); }
function dayStart(s) { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; }
function dayEnd(s) { const d = new Date(s + 'T23:59:59.999'); return isNaN(d) ? null : d; }
function parseRange(from, to) {
  let a = null, b = null;
  if (from) { a = dayStart(from); if (!a) throw ERR('INVALID_RANGE', 'تاريخ البداية غير صالح'); }
  if (to) { b = dayEnd(to); if (!b) throw ERR('INVALID_RANGE', 'تاريخ النهاية غير صالح'); }
  if (a && b && a > b) throw ERR('INVALID_RANGE', 'نطاق التاريخ غير صحيح: تاريخ البداية بعد تاريخ النهاية');
  return { a, b };
}
const inRange = (iso, r) => { if (!iso) return false; const t = new Date(iso).getTime(); return (!r.a || t >= r.a.getTime()) && (!r.b || t <= r.b.getTime()); };

/* ───────────── CSV ───────────── */
function parseCSV(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const cnt = c => (firstLine.match(new RegExp(c === '\t' ? '\t' : '\\' + c, 'g')) || []).length;
  const delim = [',', ';', '\t'].map(c => [c, cnt(c)]).sort((x, y) => y[1] - x[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function csvCell(v) {
  let s = v == null ? '' : String(v);
  if (/^[=@\t\r]/.test(s) || (/^[+-]/.test(s) && !/^[+-][\d\s]+$/.test(s))) s = "'" + s; // spreadsheet formula-injection guard
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const toCSV = (header, rows) => '\uFEFF' + [header].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');

/* ───────────── Money ───────────── */
function enrollmentCalc(price, discount, paid) {
  const net = round2(price - discount), remaining = round2(net - paid);
  return { net, remaining };
}
function derivePayment(net, paid, current) {
  if (current === 'refunded') return 'refunded';
  if (paid <= 0) return 'unpaid';
  return paid >= net ? 'paid' : 'partially_paid';
}

/* ───────────── Reports ───────────── */
function computeReports(state, user, f, now) {
  const r = parseRange(f.from, f.to);
  const hasRange = !!(r.a || r.b);
  let leads = state.leads.filter(l => !l.archived_at && (user.role === 'manager' || l.assigned_to === user.id));
  if (user.role === 'manager' && f.assigned_to) leads = leads.filter(l => l.assigned_to === f.assigned_to);
  const ids = new Set(leads.map(l => l.id));
  const cohort = hasRange ? leads.filter(l => inRange(l.created_at, r)) : leads;
  const confirmedBy = new Set(state.enrollments.filter(e => e.registration_status === 'confirmed' && ids.has(e.lead_id)).map(e => e.lead_id));
  const conv = l => confirmedBy.has(l.id);
  const contacted = cohort.filter(l => l.first_contact_at).length;
  const converted = cohort.filter(conv).length;
  const nowT = now.getTime();
  const overdueLead = l => l.next_follow_up_at && new Date(l.next_follow_up_at).getTime() < nowT && !['converted', 'lost'].includes(l.lead_status);

  const group = (keyFn, labelFn, keys) => keys.map(k => {
    const ls = cohort.filter(l => keyFn(l) === k), c = ls.filter(conv).length;
    return { key: k, label: labelFn(k), leads: ls.length, converted: c, rate: pct(c, ls.length) };
  });
  const by_source = group(l => l.lead_source, k => L.source[k], Object.keys(L.source)).filter(x => x.leads > 0);

  // follow-up completion (tasks derived from logged follow-up records that scheduled a next date)
  const fuByLead = {};
  state.follow_ups.filter(x => ids.has(x.lead_id)).forEach(x => (fuByLead[x.lead_id] = fuByLead[x.lead_id] || []).push(x));
  let due = 0, done = 0;
  Object.values(fuByLead).forEach(arr => {
    arr.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    arr.forEach((x, i) => {
      if (!x.next_follow_up_at) return;
      const t = new Date(x.next_follow_up_at).getTime();
      if (t > nowT) return;
      if (hasRange && !inRange(x.next_follow_up_at, r)) return;
      due++; if (arr[i + 1]) done++;
    });
  });

  // reps
  const repIds = user.role === 'manager'
    ? state.profiles.filter(p => p.role === 'sales' || leads.some(l => l.assigned_to === p.id)).map(p => p.id)
    : [user.id];
  const by_rep = repIds.map(id => {
    const p = state.profiles.find(x => x.id === id);
    const mine = cohort.filter(l => l.assigned_to === id);
    const mineAll = leads.filter(l => l.assigned_to === id);
    const hrs = mine.filter(l => l.first_contact_at).map(l => (new Date(l.first_contact_at) - new Date(l.created_at)) / 36e5).filter(h => h >= 0);
    const completed = state.follow_ups.filter(x => x.created_by === id && ids.has(x.lead_id) && (!hasRange || inRange(x.interaction_at, r))).length;
    const c = mine.filter(conv).length;
    return {
      user_id: id, name: p ? p.full_name : '—', active: p ? p.is_active : false,
      assigned: mine.length, contacted: mine.filter(l => l.first_contact_at).length, converted: c, rate: pct(c, mine.length),
      overdue: mineAll.filter(overdueLead).length, completed_followups: completed,
      median_first_contact_hours: hrs.length >= 5 ? Math.round(median(hrs) * 10) / 10 : null, median_n: hrs.length
    };
  });

  // non-registration reasons: latest feedback record per non-converted cohort lead
  const latestFb = {};
  state.feedback.filter(x => ids.has(x.lead_id)).forEach(x => { const c = latestFb[x.lead_id]; if (!c || new Date(x.recorded_at) > new Date(c.recorded_at)) latestFb[x.lead_id] = x; });
  const eligible = cohort.filter(l => !conv(l));
  const reasons = {}; let noFeedback = 0;
  eligible.forEach(l => { const fb = latestFb[l.id]; if (!fb) { noFeedback++; return; } reasons[fb.non_registration_reason] = (reasons[fb.non_registration_reason] || 0) + 1; });

  const regsInPeriod = state.enrollments.filter(e => e.registration_status === 'confirmed' && ids.has(e.lead_id) && (!hasRange || inRange(e.registration_date + 'T12:00:00', r))).length;
  return {
    generated_at: now.toISOString(), period: { from: f.from || null, to: f.to || null, all_time: !hasRange },
    scope: user.role === 'manager' ? (f.assigned_to ? 'rep' : 'all') : 'own',
    empty: leads.length === 0,
    total_leads: leads.length, new_leads: cohort.length, contacted, contact_rate: pct(contacted, cohort.length),
    confirmed_cohort: converted, conversion_rate: pct(converted, cohort.length), registrations_in_period: regsInPeriod,
    overdue_followups: leads.filter(overdueLead).length,
    followup_completion: { due, completed: done, rate: pct(done, due) },
    by_source, by_rep,
    non_registration: { eligible: eligible.length, no_feedback: noFeedback, reasons },
    definitions: [
      'العملاء الجدد = العملاء الذين تاريخ إضافتهم داخل الفترة المحددة (الدفعة/cohort). عند اختيار «كل الفترات» تشمل الدفعة جميع العملاء.',
      'تم التواصل = عميل سُجّل له تواصل فعلي واحد على الأقل بنتيجة غير «لم يرد» (حقل أول تواصل).',
      'معدل التواصل = العملاء الذين تم التواصل معهم ÷ عملاء الدفعة × 100.',
      'التسجيل المؤكد = اشتراك حالته «مؤكد». يُعد العميل «تم التسجيل» فقط بوجود اشتراك مؤكد واحد على الأقل، ولا يُحدَّد يدويًا.',
      'معدل التحويل = عملاء الدفعة الذين لديهم تسجيل مؤكد ÷ عملاء الدفعة نفسها × 100 (عميل واحد يُحسب مرة واحدة).',
      '«تسجيلات مؤكدة خلال الفترة» = اشتراكات مؤكدة تاريخ تسجيلها داخل الفترة من أي دفعة — لا تُستخدم في معدل التحويل.',
      'المتابعة المتأخرة = موعد المتابعة التالي أقدم من الوقت الحالي ولم تُسجَّل بعده متابعة، وحالة العميل ليست «تم التسجيل» أو «خسارة».',
      'نسبة إنجاز المتابعات = مواعيد متابعة حُددت ضمن سجلات المتابعة وحان وقتها، وسُجّلت بعدها متابعة أخرى للعميل ÷ جميع المواعيد التي حان وقتها. المواعيد المضبوطة يدويًا دون تسجيل متابعة لا تدخل في الحساب.',
      'وقت أول تواصل (الوسيط) = الوقت بين إضافة العميل وأول تواصل فعلي، ويظهر فقط عند وجود 5 حالات على الأقل.',
      'أسباب عدم التسجيل = آخر رأي مسجل لكل عميل غير مسجّل في الدفعة. العملاء بلا رأي مسجل يُعرضون منفصلين ولا يُعتبرون سببًا.'
    ],
    notes: [
      'الإسناد: يُنسب العميل إلى المندوب المسؤول عنه حاليًا، وإلى المصدر والحملة المسجلين في ملفه.',
      'مستثنى من كل التقارير: العملاء المؤرشفون.',
      'لا تُعرض تكلفة الاكتساب أو العائد على الإنفاق لأنه لم يتم إدخال أو ربط بيانات إنفاق إعلاني فعلية.'
    ]
  };
}

/* ───────────── Server (demo adapter) ───────────── */
function freshState() {
  const p = (id, name, email, role, active) => ({ id, full_name: name, email, role, is_active: active, created_at: new Date().toISOString(), updated_at: new Date().toISOString() });
  return {
    v: 1,
    profiles: [
      p('u-manager', 'منى السيد', 'mona@nova.test', 'manager', true),
      p('u-sales-1', 'أحمد حسن', 'ahmed@nova.test', 'sales', true),
      p('u-sales-2', 'سارة علي', 'sara@nova.test', 'sales', true),
      p('u-sales-3', 'كريم محمود', 'karim@nova.test', 'sales', true),
      p('u-sales-4', 'هدى فتحي', 'hoda@nova.test', 'sales', false)
    ],
    leads: [], follow_ups: [], feedback: [], enrollments: [], audit_logs: [],
    settings: {
      courses: [{ name: 'التسويق الرقمي', price: 0 }, { name: 'إعلانات ميتا', price: 0 }, { name: 'صناعة المحتوى', price: 0 }, { name: 'تيك توك للأعمال', price: 0 }],
      sales_can_register: true, sales_can_confirm: false, require_deposit: true
    },
    sessions: {}, requests: {}
  };
}

function createServer(opts) {
  opts = opts || {};
  const clock = opts.clock || (() => new Date());
  const persist = opts.persist || (() => {});
  let state = opts.state || freshState();
  const iso = () => clock().toISOString();
  const PUBLIC = new Set(['listLoginProfiles', 'login']);
  const isMgr = u => u.role === 'manager';
  const sees = (u, l) => isMgr(u) || l.assigned_to === u.id;
  const NF = () => ERR('NOT_FOUND', 'السجل غير موجود أو غير متاح لك');
  const NO = m => ERR('FORBIDDEN', m || 'غير مصرح لك بتنفيذ هذا الإجراء');
  const nameOf = id => { const p = state.profiles.find(x => x.id === id); return p ? p.full_name : '—'; };
  const enumOk = (map, v) => Object.prototype.hasOwnProperty.call(map, v);
  const failFields = f => { if (Object.keys(f).length) throw ERR('VALIDATION', 'يرجى تصحيح الحقول المحددة', { fields: f }); };

  function audit(actor, entity_type, entity_id, action, summary, related_lead_id) {
    state.audit_logs.push({ id: uuid(), actor_user_id: actor, entity_type, entity_id: entity_id || null, action, timestamp: iso(), safe_change_summary: summary, related_lead_id: related_lead_id || null });
  }
  function getLeadFor(u, id, { write = false } = {}) {
    const l = state.leads.find(x => x.id === id);
    if (!l || !sees(u, l)) throw NF();
    if (write && l.archived_at) throw ERR('ARCHIVED', 'العميل مؤرشف. استعده أولًا لتعديله');
    return l;
  }
  function idem(ctx, args, fn) {
    const k = args.request_id;
    if (k && state.requests[k]) return state.requests[k];
    const res = fn();
    if (k) {
      state.requests[k] = res;
      const keys = Object.keys(state.requests); if (keys.length > 500) delete state.requests[keys[0]];
    }
    return res;
  }
  const leadView = l => Object.assign({}, l, { assigned_to_name: nameOf(l.assigned_to), created_by_name: nameOf(l.created_by) });
  const enrView = e => { const c = enrollmentCalc(e.course_price, e.discount_amount, e.amount_paid); return Object.assign({}, e, { net_amount: c.net, remaining_amount: c.remaining }); };
  const isOverdue = l => l.next_follow_up_at && new Date(l.next_follow_up_at) < clock() && !['converted', 'lost'].includes(l.lead_status);

  function findDup(norm, exceptId) { return state.leads.filter(l => l.normalized_phone === norm && l.id !== exceptId); }

  function validateLeadFields(d, { partial = false } = {}) {
    const f = {}, out = {};
    const has = k => !partial || d[k] !== undefined;
    if (has('full_name')) { const v = String(d.full_name || '').trim(); if (v.length < 2) f.full_name = 'الاسم مطلوب (حرفان على الأقل)'; else if (v.length > 120) f.full_name = 'الاسم طويل جدًا'; else out.full_name = v; }
    if (has('phone')) {
      const n = normalizePhone(d.phone);
      if (!n.ok) f.phone = n.reason === 'empty' ? 'رقم الهاتف مطلوب' : 'رقم الهاتف غير صالح. استخدم رقمًا مصريًا مثل 01012345678 أو أضف رمز الدولة بـ + للأرقام الدولية';
      else { out.phone = String(d.phone).trim(); out.normalized_phone = n.normalized; }
    }
    if (d.email !== undefined) { const v = String(d.email || '').trim(); if (v && !EMAIL_RE.test(v)) f.email = 'البريد الإلكتروني غير صالح'; else out.email = v || null; }
    ['governorate', 'campaign_name', 'ad_name'].forEach(k => { if (d[k] !== undefined) { const v = String(d[k] || '').trim(); if (v.length > 120) f[k] = 'النص طويل جدًا'; else out[k] = v || null; } });
    if (d.general_notes !== undefined) { const v = String(d.general_notes || '').trim(); if (v.length > 2000) f.general_notes = 'الملاحظات طويلة جدًا (الحد 2000 حرف)'; else out.general_notes = v || null; }
    if (d.preferred_learning_mode !== undefined) { if (!enumOk(L.mode, d.preferred_learning_mode)) f.preferred_learning_mode = 'قيمة غير صالحة'; else out.preferred_learning_mode = d.preferred_learning_mode; }
    if (d.lead_source !== undefined) { if (!enumOk(L.source, d.lead_source)) f.lead_source = 'مصدر غير صالح'; else out.lead_source = d.lead_source; }
    if (d.interest_level !== undefined) { if (!enumOk(L.interest, d.interest_level)) f.interest_level = 'قيمة غير صالحة'; else out.interest_level = d.interest_level; }
    if (d.course_interest !== undefined) {
      const v = String(d.course_interest || '').trim();
      if (v && !state.settings.courses.some(c => c.name === v)) f.course_interest = 'الدورة غير معرفة في الإعدادات';
      else out.course_interest = v || null;
    }
    if (d.next_follow_up_at !== undefined) { const t = toISO(d.next_follow_up_at); if (t === undefined) f.next_follow_up_at = 'تاريخ المتابعة غير صالح'; else out.next_follow_up_at = t; }
    return { f, out };
  }

  const api = {
    /* ── auth ── */
    listLoginProfiles() { return state.profiles.map(p => ({ id: p.id, full_name: p.full_name, role: p.role, is_active: p.is_active })); },
    login(ctx, a) {
      const p = state.profiles.find(x => x.id === a.profile_id);
      if (!p) throw ERR('AUTH', 'الحساب غير موجود');
      if (!p.is_active) throw ERR('INACTIVE', 'هذا الحساب غير نشط. تواصل مع المدير لتفعيله');
      const token = uuid(); state.sessions[token] = { user_id: p.id, created_at: iso() };
      return { token, user: { id: p.id, full_name: p.full_name, email: p.email, role: p.role } };
    },
    logout(ctx, a, token) { delete state.sessions[token]; return { ok: true }; },
    me(ctx) { const u = ctx.user; return { id: u.id, full_name: u.full_name, email: u.email, role: u.role }; },
    bootstrap(ctx) {
      const u = ctx.user;
      return { me: api.me(ctx), directory: api.listUsers(ctx), settings: api.getSettings(ctx) };
    },

    /* ── users ── */
    listUsers(ctx) {
      const u = ctx.user;
      const rows = isMgr(u) ? state.profiles : state.profiles.filter(p => p.id === u.id);
      return rows.map(p => ({ id: p.id, full_name: p.full_name, email: p.email, role: p.role, is_active: p.is_active, created_at: p.created_at,
        assigned_count: state.leads.filter(l => l.assigned_to === p.id && !l.archived_at && l.lead_status !== 'converted').length }));
    },
    createUser(ctx, a) {
      const u = ctx.user; if (!isMgr(u)) throw NO();
      const f = {}; const name = String(a.full_name || '').trim(), email = String(a.email || '').trim().toLowerCase();
      if (name.length < 2) f.full_name = 'الاسم مطلوب';
      if (!EMAIL_RE.test(email)) f.email = 'بريد إلكتروني غير صالح'; else if (state.profiles.some(p => p.email === email)) f.email = 'البريد مستخدم من قبل';
      if (!enumOk(L.role, a.role)) f.role = 'دور غير صالح';
      failFields(f);
      const p = { id: uuid(), full_name: name, email, role: a.role, is_active: true, created_at: iso(), updated_at: iso() };
      state.profiles.push(p); audit(u.id, 'user', p.id, 'user.created', `إنشاء مستخدم بدور: ${L.role[p.role]}`);
      return p;
    },
    updateUser(ctx, a) {
      const u = ctx.user; if (!isMgr(u)) throw NO('إدارة المستخدمين والأدوار للمدير فقط');
      const p = state.profiles.find(x => x.id === a.id); if (!p) throw NF();

  function validateEnrollment(d, current, u) {
    const f = {}, v = {};
    const course = String(d.course_name || '').trim();
    if (!course || !state.settings.courses.some(c => c.name === course)) f.course_name = 'اختر دورة من القائمة المعرّفة';
    v.course_name = course;
    const dt = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
    if (!dt(d.registration_date)) f.registration_date = 'تاريخ التسجيل مطلوب'; else v.registration_date = d.registration_date;
    if (d.course_start_date) { if (!dt(d.course_start_date)) f.course_start_date = 'تاريخ غير صالح'; else v.course_start_date = d.course_start_date; } else v.course_start_date = null;
    const num = (k, label) => { const x = Number(d[k] == null || d[k] === '' ? 0 : d[k]); if (!isFinite(x) || x < 0) { f[k] = label + ' يجب أن يكون رقمًا غير سالب'; return 0; } if (x > 10000000) { f[k] = 'القيمة كبيرة جدًا'; return 0; } return round2(x); };
    const price = num('course_price', 'السعر'), disc = num('discount_amount', 'الخصم'), paid = num('amount_paid', 'المدفوع');
    if (!f.course_price && price <= 0) f.course_price = 'حدد سعر الدورة (أكبر من صفر)';
    if (!f.discount_amount && disc > price) f.discount_amount = 'الخصم لا يمكن أن يتجاوز سعر الدورة';
    if (!f.amount_paid && !f.discount_amount && !f.course_price && paid > round2(price - disc)) f.amount_paid = `المدفوع لا يمكن أن يتجاوز الصافي (${round2(price - disc)} ج.م)`;
    v.course_price = price; v.discount_amount = disc; v.amount_paid = paid;
    const rs = d.registration_status || 'pending';
    if (!enumOk(L.reg, rs)) f.registration_status = 'حالة غير صالحة';
    else {
      if (rs === 'confirmed' && !isMgr(u) && !state.settings.sales_can_confirm && !(current && current.registration_status === 'confirmed')) f.registration_status = 'تأكيد التسجيل للمدير فقط. اترك الحالة «قيد التأكيد» ليراجعها المدير';
      if (rs === 'confirmed' && state.settings.require_deposit && paid <= 0) f.registration_status = 'لا يمكن تأكيد التسجيل دون تسجيل دفعة مقدمة (يمكن تغيير هذه القاعدة من الإعدادات)';
    }
    v.registration_status = rs;
    v.payment_status = (d.payment_status === 'refunded' && paid > 0) ? 'refunded' : derivePayment(round2(price - disc), paid, null);
    if (d.payment_status === 'refunded' && paid <= 0) f.payment_status = 'لا يمكن استرداد مبلغ غير مدفوع';
    v.remaining_amount = round2(price - disc - paid);
    return { f, v };
  }

  function syncConversion(u, lead) {
    const en = state.enrollments.filter(e => e.lead_id === lead.id);
    const hasC = en.some(e => e.registration_status === 'confirmed'), hasP = en.some(e => e.registration_status === 'pending');
    let target = lead.lead_status;
    if (hasC) target = 'converted';
    else if (lead.lead_status === 'converted') target = hasP ? 'registration_pending' : 'follow_up';
    else if (hasP && ['new', 'contacted', 'interested', 'follow_up', 'nurture'].includes(lead.lead_status)) target = 'registration_pending';
    if (target !== lead.lead_status) {
      audit(u.id, 'lead', lead.id, 'lead.status_changed', `الحالة: ${L.lead_status[lead.lead_status]} ← ${L.lead_status[target]} (تلقائي بسبب الاشتراكات)`, lead.id);
      lead.lead_status = target; lead.version++; lead.updated_at = iso();
    }
  }

  function authUser(token) {
    const s = state.sessions[token];
    if (!s) throw ERR('AUTH', 'انتهت الجلسة. سجّل الدخول مرة أخرى');
    const p = state.profiles.find(x => x.id === s.user_id);
    if (!p || !p.is_active) { delete state.sessions[token]; throw ERR('INACTIVE', 'هذا الحساب غير نشط. لا يمكنه الدخول إلى النظام'); }
    return p;
  }

  async function call(method, token, args) {
    if (opts.latency) await new Promise(r => setTimeout(r, opts.latency));
    if (opts.offline && opts.offline()) throw ERR('NETWORK', 'تعذر الاتصال بالخادم. لم يتم حفظ أي تغيير. تحقق من الاتصال ثم أعد المحاولة');
    if (!Object.prototype.hasOwnProperty.call(api, method) || method.startsWith('demo') && !opts.allowDemoTools) throw ERR('NO_METHOD', 'عملية غير معروفة');
    const user = PUBLIC.has(method) ? null : authUser(token);
    const out = api[method]({ user }, structuredClone(args || {}), token);
    persist(state);
    return structuredClone(out);
  }
  return { call, getState: () => state, _setState: s => { state = s; } };
}

  el.innerHTML = head('التقارير', 'أداء الفريق ومصادر العملاء — تُحسب من السجلات الفعلية', '<button class="btn" data-act="exportReport">تصدير تقرير الأداء CSV</button>') + `<div class="card" style="margin-bottom:16px">${rangeBars('rep')}${noteBlock(r)}</div>` +
  (r.empty ? `<div class="card">${empty('لا توجد بيانات بعد', 'لن تظهر تقارير قبل وجود عملاء مسجلين.')}</div>` : `
  <div class="card"><h2>${isMgr() ? 'أداء المندوبين' : 'أدائي'}</h2><div class="tbl-wrap"><table><thead><tr><th>المندوب</th><th>العملاء المسندون</th><th>تم التواصل</th><th>تسجيلات مؤكدة</th><th>معدل التحويل</th><th>متأخرة (الآن)</th><th>متابعات مسجلة</th><th>وسيط أول تواصل</th></tr></thead><tbody>${r.by_rep.map(x => `<tr><td>${esc(x.name)}${x.active ? '' : ' ' + tag('lost', 'غير نشط')}</td><td>${x.assigned}</td><td>${x.contacted}</td><td>${x.converted}</td><td>${P(x.rate)}</td><td class="${x.overdue ? 'over' : ''}">${x.overdue}</td><td>${x.completed_followups}</td><td>${x.median_first_contact_hours == null ? `<span class="muted small">بيانات غير كافية (${x.median_n})</span>` : x.median_first_contact_hours + ' ساعة'}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h2>التحويل حسب المصدر</h2>${r.by_source.length ? `<div class="tbl-wrap"><table><thead><tr><th>المصدر</th><th>العملاء</th><th>تسجيلات مؤكدة</th><th>معدل التحويل</th></tr></thead><tbody>${r.by_source.map(s => `<tr><td>${esc(s.label)}</td><td>${s.leads}</td><td>${s.converted}</td><td>${P(s.rate)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="muted">لا توجد بيانات</div>'}</div>
  <div class="card"><h2>أسباب عدم التسجيل</h2>${reasonBars(r.non_registration)}</div>
  <div class="card"><h2>إنجاز المتابعات</h2><p style="margin:0">${r.followup_completion.completed} من ${r.followup_completion.due} موعد حان وقته (${P(r.followup_completion.rate)}).</p></div>`);
}
ACT.exportReport = async () => { const r = await api('exportReport', rangeParams('rep')); await saveFile(r.filename, r.csv); };

/* ═════════ Users ═════════ */
async function viewUsers(el, my) {
  const users = await api('listUsers'); if (stale(my)) return; S.dir = users;
  el.innerHTML = head('المستخدمون والصلاحيات', 'إدارة الحسابات والأدوار — للمدير فقط', '<button class="btn primary" data-act="newUser">+ إضافة مستخدم</button>') +
  `<div class="alert-box ${REMOTE ? 'info' : 'warn'}" style="margin-bottom:14px">${REMOTE ? '<b>الحسابات والأدوار:</b> يُنشئ المستخدمين من Supabase Auth، وتُفعّلهم وتحدد أدوارهم من هنا. تنفيذ الصلاحيات في قاعدة البيانات.' : '<b>وضع تجريبي:</b> هنا يُضاف الملف الشخصي فقط. في الإنتاج تُنشأ الحسابات عبر Supabase Auth (دعوة بالبريد) ويرتبط الملف الشخصي بمعرّف المصادقة؛ لا تُدار كلمات المرور في هذه الواجهة.'}</div>
  <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th><th>عملاء نشطون</th><th></th></tr></thead><tbody>${users.map(u => `<tr><td><b>${esc(u.full_name)}</b>${u.id === S.me.id ? ' <span class="muted small">(أنت)</span>' : ''}</td><td>${u.email ? num(u.email) : '—'}</td>
  <td>${u.id === S.me.id ? esc(L.role[u.role]) : `<select data-change="userRole" data-id="${u.id}" aria-label="دور ${esc(u.full_name)}">${opts(L.role, u.role)}</select>`}</td><td>${u.is_active ? tag('converted', 'نشط') : tag('lost', 'غير نشط')}</td><td>${u.assigned_count}</td>
  <td>${u.id === S.me.id ? '' : `<button class="btn sm ${u.is_active ? 'danger' : ''}" data-act="toggleUser" data-id="${u.id}" data-active="${u.is_active ? 1 : ''}" data-n="${u.assigned_count}">${u.is_active ? 'تعطيل' : 'تفعيل'}</button>`}</td></tr>`).join('')}</tbody></table></div>
  <div class="card" style="margin-top:16px"><h2>مصفوفة الصلاحيات</h2><div class="tbl-wrap"><table><thead><tr><th>الإجراء</th><th>مدير</th><th>مندوب</th></tr></thead><tbody>${[['عرض كل العملاء', 1, 0], ['عرض العملاء المسندين له فقط', 1, 1], ['إضافة وتعديل العملاء', 1, 'المسندون له'], ['إسناد وإعادة إسناد العملاء', 1, 0], ['تسجيل المتابعات والآراء', 1, 'عملاؤه'], ['إنشاء اشتراك', 1, 'حسب الإعدادات'], ['تأكيد التسجيل (التحويل)', 1, 'حسب الإعدادات'], ['إدارة المستخدمين والأدوار', 1, 0], ['سجل التغييرات والإعدادات', 1, 0], ['أرشفة العملاء', 1, 0]].map(r => `<tr><td>${r[0]}</td><td>${r[1] ? '✓' : '—'}</td><td>${r[2] === 1 ? '✓' : r[2] === 0 ? '—' : esc(r[2])}</td></tr>`).join('')}</tbody></table></div></div>`;
}
CHG.userRole = async t => { try { await api('updateUser', { id: t.dataset.id, patch: { role: t.value } }); toast('تم تغيير الدور'); } catch (e) { fail(e); } renderView(); };
ACT.newUser = () => REMOTE ? openModal('إضافة مستخدم', '<p style="margin-top:0">تُنشأ الحسابات من لوحة Supabase: <b>Authentication ← Users ← Add user</b> (مع تفعيل Auto Confirm). بعد إنشائه يظهر هنا <b>غير نشط</b> وتستطيع تفعيله وتحديد دوره من هذه الشاشة.</p><div class="form-foot"><button class="btn primary" data-act="closeModal">حسنًا</button></div>', { sm: true }) : openModal('إضافة مستخدم', formShell('newUser', `<div class="form-grid">${fld('الاسم الكامل', 'full_name', inp('full_name', { req: true }), { req: true })}${fld('البريد الإلكتروني', 'email', inp('email', { type: 'email', req: true }), { req: true })}${fld('الدور', 'role', sel('role', opts(L.role, 'sales')))}</div>`, { submit: 'إضافة' }), { sm: true });
FORM.newUser = async f => { await api('createUser', formData(f)); toast('تمت إضافة المستخدم'); f.closest('dialog').close(); renderView(); };
ACT.toggleUser = async t => {
  const id = t.dataset.id, active = !!t.dataset.active;
  if (!active) { if (!await confirmBox({ title: 'تفعيل الحساب', msg: 'سيتمكن المستخدم من الدخول مجددًا.', ok: 'تفعيل' })) return; await api('updateUser', { id, patch: { is_active: true } }); toast('تم تفعيل الحساب'); renderView(); return; }
  if (+t.dataset.n > 0) { openModal('تعطيل مستخدم لديه عملاء', formShell('deactivate', `<input type="hidden" name="id" value="${id}"><p class="small" style="margin-top:0">لدى هذا المستخدم ${t.dataset.n} عميل نشط. اختر من ستُنقل إليه ملفاتهم قبل التعطيل.</p>${fld('نقل العملاء إلى', 'reassign_to', sel('reassign_to', userOpts('', true).replace(new RegExp(`<option value="${id}"[^>]*>.*?</option>`), '')))}`, { submit: 'نقل وتعطيل' }), { sm: true }); return; }
  if (!await confirmBox({ title: 'تعطيل الحساب', msg: 'لن يتمكن المستخدم من الدخول وستنتهي جلساته.', ok: 'تعطيل', danger: true })) return; await api('updateUser', { id, patch: { is_active: false } }); toast('تم تعطيل الحساب'); renderView();
};
FORM.deactivate = async f => { const d = formData(f); await api('updateUser', { id: d.id, patch: { is_active: false, reassign_to: d.reassign_to } }); toast('تم نقل العملاء وتعطيل الحساب'); f.closest('dialog').close(); renderView(); };

/* ═════════ Audit ═════════ */
const ACT_AR = { 'lead.created': 'إنشاء عميل', 'lead.updated': 'تعديل عميل', 'lead.status_changed': 'تغيير حالة', 'lead.assigned': 'إسناد', 'lead.archived': 'أرشفة', 'lead.restored': 'استعادة', 'enrollment.created': 'إنشاء اشتراك', 'enrollment.status_changed': 'تغيير حالة اشتراك', 'enrollment.corrected': 'تصحيح اشتراك', 'enrollment.payment': 'دفعة', 'user.created': 'إنشاء مستخدم', 'user.role_changed': 'تغيير دور', 'user.deactivated': 'تعطيل مستخدم', 'user.activated': 'تفعيل مستخدم', 'settings.updated': 'تعديل الإعدادات', 'export.leads': 'تصدير عملاء', 'export.report': 'تصدير تقرير', 'import.leads': 'استيراد', 'demo.test_data_loaded': 'تحميل بيانات اختبار' };
const auditTable = rows => `<div class="tbl-wrap"><table><thead><tr><th>الوقت</th><th>المنفّذ</th><th>الإجراء</th><th>الملخص</th></tr></thead><tbody>${rows.map(x => `<tr><td class="nowrap">${fmtDT(x.timestamp)}</td><td>${esc(x.actor_name)}</td><td>${esc(ACT_AR[x.action] || x.action)}</td><td class="small">${esc(x.safe_change_summary)}</td></tr>`).join('')}</tbody></table></div>`;
async function viewAudit(el, my) {
  const a = S.au; const r = await api('listAudit', { entity_type: a.entity, from: a.from, to: a.to, page: a.page }); if (stale(my)) return;
  const pages = Math.max(1, Math.ceil(r.total / r.page_size));
  el.innerHTML = head('سجل التغييرات', 'سجل للقراءة فقط يُنشأ تلقائيًا ولا يمكن تعديله أو حذفه من الواجهة', '') + `<div class="filters"><div class="fld"><label>نوع السجل</label><select data-change="auF" data-k="entity"><option value="">الكل</option>${opts({ lead: 'عميل', enrollment: 'اشتراك', user: 'مستخدم', settings: 'إعدادات', export: 'تصدير', import: 'استيراد' }, a.entity)}</select></div><div class="fld"><label>من</label><input type="date" data-change="auF" data-k="from" value="${esc(a.from)}"></div><div class="fld"><label>إلى</label><input type="date" data-change="auF" data-k="to" value="${esc(a.to)}"></div></div>` +
  (r.rows.length ? auditTable(r.rows) + `<div class="pager"><span class="muted small">${r.total} سجل · صفحة ${r.page} من ${pages}</span><span class="actions"><button class="btn sm" data-act="auPage" data-p="${r.page - 1}"${r.page <= 1 ? ' disabled' : ''}>السابق</button><button class="btn sm" data-act="auPage" data-p="${r.page + 1}"${r.page >= pages ? ' disabled' : ''}>التالي</button></span></div>` : `<div class="card">${empty('لا توجد سجلات', 'تُسجَّل التغييرات المهمة تلقائيًا عند حدوثها.')}</div>`);
}
CHG.auF = t => { S.au[t.dataset.k] = t.value; S.au.page = 1; renderView(); };
ACT.auPage = t => { S.au.page = +t.dataset.p; renderView(); };

/* ═════════ Settings ═════════ */
async function viewSettings(el, my) {
  const s = await api('getSettings'); S.settings = s; if (stale(my)) return;
  el.innerHTML = head('الإعدادات', '', '') +
  `<div class="card"><h2>حالة الاتصال بالخادم</h2><div class="alert-box warn"><b>وضع تجريبي (Demo adapter).</b> لا يوجد اتصال بقاعدة بيانات أو مصادقة. تُحفظ البيانات في ذاكرة هذا المتصفح ${ST.storageOK ? '(التخزين المحلي يعمل)' : '(<b>التخزين المحلي غير متاح</b> — ستضيع البيانات عند التحديث)'}. لا مشاركة بين الأجهزة أو المستخدمين. راجع ملف DEPLOYMENT.md للنشر الآمن مع Supabase.</div></div>
  <div class="card"><h2>الدورات وأسعارها</h2><form data-form="courses" novalidate><div id="course-rows">${s.courses.map(courseRow).join('')}</div><div class="actions" style="margin-top:8px"><button type="button" class="btn sm" data-act="addCourse">+ إضافة دورة</button></div><div class="form-err"></div><div class="form-foot"><button class="btn primary" type="submit">حفظ الدورات</button></div></form></div>
  <div class="card"><h2>قواعد التسجيل</h2><form data-form="rules" novalidate><label style="display:flex;gap:8px;margin-bottom:8px"><input type="checkbox" name="sales_can_register"${s.sales_can_register ? ' checked' : ''}> يمكن للمندوب إنشاء اشتراكات (قيد التأكيد) وتسجيل دفعات لعملائه</label>
  <label style="display:flex;gap:8px;margin-bottom:8px"><input type="checkbox" name="sales_can_confirm"${s.sales_can_confirm ? ' checked' : ''}> يمكن للمندوب تأكيد التسجيل (يحوّل العميل إلى «تم التسجيل»)</label>
  <label style="display:flex;gap:8px"><input type="checkbox" name="require_deposit"${s.require_deposit ? ' checked' : ''}> لا يُؤكد التسجيل دون دفعة مقدمة أكبر من صفر</label><div class="form-err"></div><div class="form-foot"><button class="btn primary" type="submit">حفظ القواعد</button></div></form></div>
  <div class="card"><h2>أدوات الوضع التجريبي</h2><p class="small muted" style="margin-top:0">لأغراض الاختبار فقط. لا توجد هذه الأدوات في النسخة الإنتاجية.</p>
  <label style="display:flex;gap:8px;margin-bottom:12px"><input type="checkbox" data-change="offline"${OFFLINE.on ? ' checked' : ''}> محاكاة انقطاع الشبكة (لاختبار رسائل فشل الحفظ)</label>
  <div class="actions"><button class="btn" data-act="loadTest">تحميل بيانات اختبار (30 عميلًا)</button><button class="btn danger" data-act="resetDemo">مسح كل بيانات العملاء التجريبية</button></div></div>`;
  if (REMOTE) $$('.card', el).forEach(c => { const h = $('h2', c); if (!h) return; if (h.textContent.includes('أدوات الوضع التجريبي')) c.remove(); else if (h.textContent.includes('حالة الاتصال')) c.innerHTML = '<h2>حالة الاتصال بالخادم</h2><div class="alert-box ok">متصل بقاعدة بيانات Supabase. المصادقة والصلاحيات (RLS) تُفرض داخل قاعدة البيانات. <span class="num">' + esc(CFG.url) + '</span></div>'; });
}
const courseRow = c => `<div class="form-grid" style="grid-template-columns:2fr 1fr auto;align-items:end;margin-bottom:8px" data-course><div class="fld"><label>اسم الدورة</label><input type="text" name="cname" value="${esc(c.name)}"></div><div class="fld"><label>السعر الافتراضي (ج.م)</label><input type="number" name="cprice" min="0" step="0.01" value="${esc(c.price)}"></div><button type="button" class="btn sm danger" data-act="rmCourse">حذف</button></div>`;
ACT.addCourse = () => { $('#course-rows').insertAdjacentHTML('beforeend', courseRow({ name: '', price: 0 })); };
ACT.rmCourse = t => t.closest('[data-course]').remove();
FORM.courses = async f => { const courses = $$('[data-course]', f).map(r => ({ name: $('[name=cname]', r).value, price: $('[name=cprice]', r).value })).filter(c => c.name.trim() || +c.price); await api('updateSettings', { settings: { courses } }); toast('تم حفظ الدورات'); S.settings = await api('getSettings'); renderView(); };
FORM.rules = async f => { const g = n => $(`[name=${n}]`, f).checked; await api('updateSettings', { settings: { sales_can_register: g('sales_can_register'), sales_can_confirm: g('sales_can_confirm'), require_deposit: g('require_deposit') } }); toast('تم حفظ القواعد'); S.settings = await api('getSettings'); };
CHG.offline = t => { OFFLINE.on = t.checked; updateOfflineFlag(); toast(OFFLINE.on ? 'تم تفعيل محاكاة انقطاع الشبكة' : 'تم إيقاف المحاكاة'); };
ACT.offlineOff = () => { OFFLINE.on = false; updateOfflineFlag(); toast('تم إيقاف المحاكاة'); renderView(); };
ACT.loadTest = async () => { if (!await confirmBox({ title: 'تحميل بيانات اختبار', msg: 'سيُضاف 30 عميلًا تجريبيًا مع متابعات وآراء واشتراكات مولّدة لأغراض الاختبار فقط. ستظهر في التقارير كأي بيانات.', ok: 'تحميل' })) return; const r = await api('demoLoadTestData'); toast(`تم تحميل ${r.leads} عميل اختبار`); };
ACT.resetDemo = async () => { if (!await confirmBox({ title: 'مسح البيانات التجريبية', msg: 'سيُحذف كل العملاء والمتابعات والآراء والاشتراكات وسجل التغييرات من هذا المتصفح. لا يمكن التراجع.', ok: 'مسح كل شيء', danger: true })) return; await api('demoReset'); toast('تم مسح البيانات التجريبية'); refreshBadge(); };

/* ═════════ Start ═════════ */
window.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
})();

</script>
</body>
</html>
