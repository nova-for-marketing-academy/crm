${table(['الاسم','رقم الهاتف','مصدر العميل','الحملة الإعلانية','الكورس المطلوب','طريقة الدراسة','حالة العميل','درجة الاهتمام','الموظف المسؤول','آخر تواصل','المتابعة القادمة','تاريخ التسجيل','إجراءات'],shown.map(l=>`<tr><td><button class="link font-bold" data-open="${l.id}">${safe(l.name)}</button></td><td dir="ltr">${safe(l.phone)}</td><td>${safe(l.source)}</td><td>${safe(l.campaign)}</td><td>${safe(l.course)}</td><td>${safe(l.mode)}</td><td>${chip(l.status)}</td><td>${safe(l.interest)}</td><td>${safe(nameOf(l.assigned))}</td><td>${egDate(l.last)}</td><td>${egDate(l.next)}</td><td>${egDate(l.created)}</td><td>${btn('تعديل','edit:'+l.id)} ${user().role==='مدير'?btn('إسناد','assign:'+l.id):''} ${btn('أرشفة','archive:'+l.id,'danger')}</td></tr>`).join(''))}

function usersView(){return `${head('المستخدمون والصلاحيات')}<div class="card p-4 mb-4 text-sm">هذه الأدوار محاكاة واجهة فقط؛ لا توجد مصادقة أو صلاحيات خادم. في الإنتاج: يرى المدير جميع عملاء NOVA، ويرى المندوب المسندين إليه فقط. لا يغيّر المندوب دوره، ويتطلب الإسناد صلاحية مدير، ولا يصل المستخدم غير النشط للسجلات. ترث السجلات التابعة صلاحية العميل، ويجب فرض ذلك بـ RLS على الخادم وقاعدة البيانات حتى عند تغيير معرف السجل أو طلب API.</div>${table(['المستخدم','الدور','الحالة','العملاء المسندون','آخر نشاط','إجراء'],db.users.map(u=>`<tr><td>${safe(u.name)}</td><td>${safe(u.role)}</td><td>${chip(u.active?'نشط':'غير نشط')}</td><td>${db.leads.filter(l=>!l.archived&&l.assigned===u.id).length}</td><td>${egDate(db.audit.find(a=>a.actor===u.id)?.at)}</td><td>${user().role==='مدير'?btn('تعديل','user:'+u.id):'—'}</td></tr>`).join(''))}`}

function settingsView(){return `${head('الإعدادات')}<div class="grid lg:grid-cols-2 gap-4"><section class="card p-5"><h2 class="font-extrabold mb-3">الملف والتفضيلات التجريبية</h2><label for="settings-user">المستخدم الحالي</label><select id="settings-user" class="field mb-4">${db.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${actor===u.id?'selected':''}>${safe(u.name)} · ${safe(u.role)}</option>`).join('')}</select><p class="text-sm mb-3">المنطقة: مصر · العملة: EGP · التوقيت: القاهرة. تغيير الدور لا يوفّر أمنًا أو دخولًا حقيقيًا.</p><label for="notifications">التنبيهات داخل التطبيق</label><select id="notifications" class="field"><option>مفعّلة في هذه الجلسة</option><option>متوقفة في هذه الجلسة</option></select></section><section class="card p-5"><h2 class="font-extrabold mb-3">بيانات العرض</h2><p class="text-sm mb-4">وضع تجريبي: البيانات في ذاكرة الصفحة فقط؛ تزول عند إعادة تحميلها. ملف التصدير وسيلة نسخ خارجية، وليس قاعدة بيانات مشتركة أو نسخة آمنة تلقائية.</p><div class="flex flex-wrap gap-2">${btn('تصدير JSON','export')}${btn('استيراد JSON','import')}${btn('إعادة ضبط بيانات العرض','reset','danger')}</div><input id="import-file" type="file" accept="application/json,.json" class="hidden" aria-label="ملف استيراد JSON"></section></div>
<section class="card p-5 mt-4"><h2 class="font-extrabold mb-4">جاهزية الإنتاج — ما الذي بقي؟</h2><div class="grid md:grid-cols-2 gap-5 text-sm leading-7"><div><h3 class="font-bold">النقل والبنية</h3><p>يمكن نسخ واجهة HTML ومنطق الأعمال إلى مشروع خارجي وإعادة بناء مزود البيانات كعميل API. مخطط Supabase المقترح: profiles، leads، followups، feedback، registrations، audit_events؛ مفاتيح UUID وروابط lead_id وactor_id وفهارس للهاتف والإسناد والتواريخ.</p><p><strong>أسماء متغيرات البيئة المطلوبة:</strong> SUPABASE_URL، SUPABASE_ANON_KEY. تُضبط خارج الشيفرة المنشورة، دون وضع أسرار خدمة في المتصفح.</p></div><div><h3 class="font-bold">الأمن والنشر والاختبار</h3><p>المطلوب: Supabase Auth حقيقي، أدوار موثوقة في الخادم، PostgreSQL مع RLS لكل جدول وللسجلات التابعة، سياسات مدير/مندوب، وتسجيل تغييرات موثوق من الخادم. ثم مشروع نشر، إعداد نطاق وبيئة، نسخ احتياطي ومراقبة.</p><p><strong>فحص وظيفي:</strong> إنشاء وتكرار الهاتف، الإسناد، عزل المندوب، منع تبديل الدور، متابعة وتاريخها، حساب الرصيد، منع تكرار التسجيل، التحويل عند Confirmed فقط، الاستيراد، التصدير، ومقاومة تعديل معرفات API.</p></div></div><p class="mt-4 p-3 rounded bg-red-50 text-red-900 text-sm"><strong>تجريبي فقط:</strong> تبديل المستخدم، تصفية الدور، البيانات والعينة، سجل التغييرات، التنبيهات، الاستيراد والتصدير المحليان. لا توجد مصادقة، تفويض خلفي، Supabase أو نشر إنتاجي مكتمل.</p></section>`}
function renderProfile(){let l=leadOf(profile);if(!l||!allowedLead(profile)){profile=null;return empty('هذا العميل غير متاح في نطاق العرض الحالي.')}let tabs=['نظرة عامة','سجل المتابعات','Feedback','التسجيل','سجل التغييرات'];let content=tab===0?`<div class="grid sm:grid-cols-2 gap-3 text-sm">${[['الهاتف',l.phone],['الحالة',l.status],['الاهتمام',l.interest],['المصدر',l.source],['الحملة',l.campaign],['الكورس',l.course],['طريقة الدراسة',l.mode],['الموظف',nameOf(l.assigned)],['الإجراء القادم',egDate(l.next)]].map(([k,v])=>`<div class="border-b py-2"><span class="text-gray-500">${k}:</span> <strong>${safe(v)}</strong></div>`).join('')}</div>`:tab===1?timeline(provider.followups.fetch().filter(f=>f.leadId===l.id).map(f=>`${egDate(f.at)} · ${f.type} · ${f.outcome} · ${f.response} · ${f.notes}`)) :tab===2?timeline(provider.feedback.fetch().filter(f=>f.leadId===l.id).map(f=>`${egDate(f.at)} · ${f.reason} · ${f.notes} · ${f.action}`)):tab===3?timeline(provider.registrations.fetch().filter(r=>r.leadId===l.id).map(r=>`${egDate(r.date)} · ${r.course} · ${r.status} · المتبقي ${money(r.price-r.discount-r.paid)}`)):timeline(provider.audit.read().filter(a=>a.record===l.id||[...db.followups,...db.feedback,...db.registrations].some(r=>r.id===a.record&&r.leadId===l.id)).map(a=>`${egDate(a.at)} · ${nameOf(a.actor)} · ${a.action}: ${a.change} ${a.oldValue} ← ${a.newValue}`));
return `${head(safe(l.name),btn('العودة للقائمة','back')+btn('تعديل','edit:'+l.id)+btn('تسجيل متابعة','follow:'+l.id,'primary'))}<div class="card p-5 mb-4"><div class="flex flex-wrap gap-2">${chip(l.status)} ${chip(l.interest)} <span dir="ltr">${safe(l.phone)}</span></div><div class="flex flex-wrap gap-2 mt-4">${btn('إضافة Feedback','feedback:'+l.id)}${btn('إضافة تسجيل','registration:'+l.id)}${btn('نسخ الرسالة','copy:'+l.id)}</div></div><div class="flex gap-2 overflow-x-auto mb-4">${tabs.map((t,i)=>`<button data-tab="${i}" class="btn whitespace-nowrap ${tab===i?'primary':''}">${t}</button>`).join('')}</div><div class="card p-5">${content}</div>`}
function timeline(items){return items.length?`<ol class="border-r-2 border-red-200 pr-5 space-y-4">${items.map(t=>`<li class="relative text-sm before:absolute before:w-2 before:h-2 before:rounded-full before:bg-red-600 before:-right-[25px] before:top-2">${safe(t)}</li>`).join('')}</ol>`:'لا توجد سجلات لهذا العميل بعد.'}
function modal(title,body,onSubmit='',wide=false){activeModal=onSubmit;document.getElementById('modal-root').innerHTML=`<div class="modal-back" id="backdrop"><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="flex justify-between items-center mb-5"><h2 id="modal-title" class="text-xl font-extrabold">${title}</h2><button type="button" class="btn" data-action="close" aria-label="إغلاق">✕</button></div>${onSubmit?`<form id="modal-form" novalidate>${body}<div id="form-error" class="text-red-700 text-sm mt-3" role="alert"></div><div class="flex gap-2 justify-end mt-5"><button type="button" class="btn" data-action="close">إلغاء</button><button type="submit" class="btn primary">حفظ</button></div></form>`:body}</div></div>`;document.querySelector('#modal-root input,#modal-root select,#modal-root button')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';activeModal=null}
function field(label,key,value='',type='text',required=false){return `<div><label for="m-${key}">${label}${required?' *':''}</label><input id="m-${key}" name="${key}" class="field" type="${type}" value="${safe(value)}" ${required?'required':''}></div>`}
function sel(label,key,values,value='',required=true){return `<div><label for="m-${key}">${label}</label><select id="m-${key}" name="${key}" class="field" ${required?'required':''}>${options(values,value,'اختر')}</select></div>`}
function leadSelect(value=''){return `<div><label for="m-leadId">العميل *</label><select id="m-leadId" name="leadId" class="field" required>${options(visible().map(l=>l.id),value,'اختر العميل').replace(/<option value="(l[0-9]+)"([^>]*)>[^<]*<\/option>/g,(_,k,r)=>`<option value="${k}"${r}>${safe(leadOf(k)?.name)}</option>`)}</select></div>`}
function leadForm(l){modal(l?'تعديل العميل':'إضافة عميل محتمل',`<div class="grid-fields">${field('الاسم','name',l?.name,'text',true)}${field('رقم الهاتف','phone',l?.phone,'tel',true)}${sel('المصدر','source',SOURCES,l?.source)}${field('الحملة الإعلانية','campaign',l?.campaign)}${field('الكورس المطلوب','course',l?.course,'text',true)}${sel('طريقة الدراسة','mode',MODES,l?.mode||'لم يحدد')}${sel('حالة العميل','status',STATUS,l?.status||'جديد')}${sel('درجة الاهتمام','interest',INTEREST,l?.interest||'غير محدد')}${user().role==='مدير'?`<div><label for="m-assigned">الموظف المسؤول</label><select id="m-assigned" name="assigned" class="field">${employeeOptions(l?.assigned||actor)}</select></div>`:''}${field('موعد المتابعة القادمة','next',l?.next,'datetime-local')}</div><div id="duplicate-warning" class="mt-3 text-sm text-red-800"></div>`, 'lead:'+ (l?.id||''))}
function followForm(lid=''){modal('تسجيل تواصل جديد',`<div class="grid-fields">${leadSelect(lid)}${sel('نوع التفاعل','type',['WhatsApp','مكالمة هاتفية','أخرى'])}${sel('النتيجة','outcome',OUTCOMES)}${field('رد العميل','response')}${field('ملاحظات','notes')}${field('المتابعة القادمة','next','','datetime-local')}</div><p class="small mt-3">يُحفظ تاريخ ووقت التفاعل تلقائيًا ويُضاف كسجل جديد دون استبدال السابق.</p>`,'follow')}
function feedbackForm(lid=''){modal('إضافة Feedback',`<div class="grid-fields">${leadSelect(lid)}${sel('درجة الاهتمام','interest',INTEREST)}${sel('سبب عدم الاشتراك','reason',REASONS)}${sel('اعتراض على السعر','price',['لا','نعم'],'لا')}${sel('اعتراض على طريقة الدراسة','mode',['لا','نعم'],'لا')}${field('ملاحظات العميل','notes')}${field('الإجراء المقترح','action','', 'text',true)}</div>`,'feedback')}
function registrationForm(lid=''){modal('تسجيل اشتراك',`<div class="grid-fields">${leadSelect(lid)}${field('الكورس','course',leadOf(lid)?.course,'text',true)}${field('تاريخ التسجيل','date',today(),'date',true)}${field('بداية الكورس','start','','date',true)}${field('سعر الكورس EGP','price','0','number',true)}${field('الخصم EGP','discount','0','number',true)}${field('المدفوع EGP','paid','0','number',true)}${sel('حالة التسجيل','status',['Pending','Confirmed','Cancelled'],'Pending')}</div><div class="card p-3 mt-4">الرصيد المتبقي: <strong id="balance-preview">${money(0)}</strong></div><p class="small mt-2">لا تُحتسب النية في الدفع كتحويل؛ يُحتسب Confirmed فقط.</p>`,'registration')}
function confirmAction(title,text,callback){window.confirmCallback=callback;modal(title,`<p>${safe(text)}</p><div class="flex gap-2 justify-end mt-5"><button class="btn" data-action="close">إلغاء</button><button class="btn primary" data-action="confirm">تأكيد</button></div>`)}
function fail(msg){document.getElementById('form-error').textContent=msg}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
async function submitForm(e){e.preventDefault();let button=e.currentTarget.querySelector('[type=submit]');button.disabled=true;button.textContent='جارٍ الحفظ...';let d=formData(e.currentTarget);
try{if(activeModal.startsWith('lead:')){let lid=activeModal.slice(5),phone=d.phone.replace(/\D/g,'');if(!d.name.trim()||!d.course.trim()||!d.source)throw Error('أكمل الاسم والكورس والمصدر.');if(!/^01[0125]\d{8}$/.test(phone))throw Error('أدخل رقم هاتف مصري صالحًا يبدأ بـ 01 ويتكون من 11 رقمًا.');let dup=db.leads.filter(l=>l.phone.replace(/\D/g,'')===phone&&l.id!==lid);if(dup.length){document.getElementById('duplicate-warning').innerHTML=`رقم الهاتف موجود بالفعل: ${dup.map(l=>`<button type="button" class="link" data-open="${l.id}">${safe(l.name)}</button>`).join('، ')}`;throw Error('راجع السجل المطابق قبل الحفظ؛ لن يُنشأ عميل مكرر.')}d.phone=phone;d.assigned=user().role==='مدير'?d.assigned:actor;if(!d.assigned)throw Error('اختر الموظف المسؤول.');if(lid){if(!allowedLead(lid))throw Error('العميل غير متاح.');let previous=leadOf(lid).assigned;provider.leads.update(lid,d);if(previous!==d.assigned)audit('إسناد',lid,'إعادة إسناد',nameOf(d.assigned))}else provider.leads.create(d)}
else if(activeModal==='follow'){if(!allowedLead(d.leadId)||!d.type||!d.outcome)throw Error('اختر العميل ونوع التفاعل والنتيجة.');provider.followups.create(d)}
else if(activeModal==='feedback'){if(!allowedLead(d.leadId)||!d.reason||!d.interest||!d.action.trim())throw Error('أكمل العميل والاهتمام والسبب والإجراء المقترح.');d.price=d.price==='نعم';d.mode=d.mode==='نعم';provider.feedback.create(d)}
else if(activeModal==='registration'){let price=Number(d.price),discount=Number(d.discount),paid=Number(d.paid);if(!allowedLead(d.leadId)||!d.course.trim()||!d.date||!d.start||!d.status)throw Error('أكمل الحقول المطلوبة.');if([price,discount,paid].some(n=>!Number.isFinite(n)||n<0)||price-discount-paid<0)throw Error('المبالغ لا تقبل القيم السالبة أو رصيدًا سالبًا.');if(db.registrations.some(r=>r.leadId===d.leadId&&r.course.trim()===d.course.trim()&&r.status!=='Cancelled'))throw Error('يوجد تسجيل نشط بالفعل لهذا العميل والكورس.');provider.registrations.create({...d,price,discount,paid});if(d.status==='Confirmed')leadOf(d.leadId).status='مشترك'}
else if(activeModal.startsWith('user:')){if(user().role!=='مدير')throw Error('التعديل متاح للمدير فقط.');let u=db.users.find(x=>x.id===activeModal.slice(5));if(u.id===actor&&d.role!==u.role)throw Error('لا يمكنك تغيير دورك الحالي.');if(u.id===actor&&d.active==='false')throw Error('لا يمكنك تعطيل المستخدم الحالي.');let change=`${u.role} / ${u.active?'نشط':'غير نشط'} ← ${d.role} / ${d.active==='true'?'نشط':'غير نشط'}`;u.role=d.role;u.active=d.active==='true';audit('صلاحيات',u.id,'تعديل صلاحيات',change)}
closeModal();render();toast('تم الحفظ بنجاح.')}catch(err){fail(err.message)}finally{button.disabled=false;button.textContent='حفظ'}}
document.addEventListener('submit',e=>{if(e.target.id==='modal-form')submitForm(e)});
document.addEventListener('click',async e=>{let t=e.target.closest('[data-page],[data-action],[data-open],[data-tab],[data-followtab],[data-sort]');if(!t)return;
if(t.dataset.page!==undefined)return setPage(Number(t.dataset.page));
if(t.dataset.open){let l=leadOf(t.dataset.open);if(allowedLead(l?.id)){profile=l.id;tab=0;closeModal();render()}return}
if(t.dataset.tab!==undefined){tab=Number(t.dataset.tab);return render()}
if(t.dataset.followtab!==undefined){followTab=Number(t.dataset.followtab);return render()}
if(t.dataset.sort){sortDir=sortKey===t.dataset.sort?-sortDir:1;sortKey=t.dataset.sort;return render()}
let a=t.dataset.action;if(!a)return;
if(a==='close')return closeModal();
if(a==='confirm'){try{await window.confirmCallback();closeModal();render();toast('تم تنفيذ الإجراء.')}catch(err){toast(err.message,true)}return}
if(a==='new-lead')return leadForm();if(a.startsWith('edit:'))return leadForm(leadOf(a.slice(5)));
if(a.startsWith('assign:')){let lid=a.slice(7);return modal('إسناد العميل',`<div><label for="m-assigned">الموظف المسؤول</label><select id="m-assigned" class="field">${employeeOptions(leadOf(lid).assigned)}</select></div><div class="flex justify-end gap-2 mt-5"><button class="btn" data-action="close">إلغاء</button><button class="btn primary" data-action="assign-save:${lid}">حفظ الإسناد</button></div>`)}
if(a.startsWith('assign-save:')){try{provider.leads.assign(a.slice(12),document.getElementById('m-assigned').value);closeModal();render();toast('تم الإسناد.')}catch(err){toast(err.message,true)}return}
if(a.startsWith('archive:'))return confirmAction('تأكيد الأرشفة','سيُخفى العميل من القوائم النشطة وتبقى سجلاته في بيانات العرض.',()=>provider.leads.archive(a.slice(8)));
if(a==='new-follow'||a.startsWith('follow:'))return followForm(a==='new-follow'?'':a.slice(7));
if(a==='new-feedback'||a.startsWith('feedback:'))return feedbackForm(a==='new-feedback'?'':a.slice(9));
if(a==='new-registration'||a.startsWith('registration:'))return registrationForm(a==='new-registration'?'':a.slice(13));
if(a.startsWith('regdetail:')){let r=db.registrations.find(x=>x.id===a.slice(10));return modal('تفاصيل التسجيل',`<div class="space-y-2"><p>العميل: ${safe(leadOf(r.leadId)?.name)}</p><p>الكورس: ${safe(r.course)}</p><p>المتبقي: ${money(r.price-r.discount-r.paid)}</p><p>الحالة: ${chip(r.status)}</p></div><div class="flex gap-2 mt-5">${r.status==='Pending'?btn('تأكيد التسجيل','regstatus:'+r.id+':Confirmed','primary'):''}${r.status!=='Cancelled'?btn('إلغاء التسجيل','regstatus:'+r.id+':Cancelled','danger'):''}</div>`)}
if(a.startsWith('regstatus:')){let [,rid,status]=a.split(':');return confirmAction('تأكيد تغيير التسجيل',`تغيير حالة التسجيل إلى ${status}؟`,()=>provider.registrations.update(rid,status))}
if(a.startsWith('user:')){let u=db.users.find(x=>x.id===a.slice(5));return modal('تعديل صلاحيات تجريبية',`<div class="grid-fields">${sel('الدور','role',['مدير','مندوب مبيعات'],u.role)}${sel('الحالة','active',['true','false'],String(u.active)).replace('>true<','>نشط<').replace('>false<','>غير نشط<')}</div><p class="small mt-3">هذا تعديل محاكاة ولا يفرض صلاحيات خادم.</p>`,'user:'+u.id)}
if(a==='back')return setPage(1);
if(a==='clear-filters'){filters={q:'',status:'',source:'',employee:'',interest:'',from:'',to:''};leadPage=1;return render()}
if(a==='prev'||a==='next'){leadPage=Math.max(1,leadPage+(a==='prev'?-1:1));return render()}
if(a.startsWith('copy:')){let l=leadOf(a.slice(5));try{await navigator.clipboard.writeText(`مرحبًا ${l.name}، معك فريق NOVA FOR MARKETING. يسعدنا مساعدتك في تفاصيل كورس ${l.course}. ما الوقت المناسب للتواصل معك؟`);toast('تم نسخ الرسالة فقط؛ لم تُرسل عبر WhatsApp.')}catch{toast('تعذر النسخ؛ تحقق من إذن الحافظة.',true)}return}
if(a==='export'){let blob=new Blob([provider.transfer.export()],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='nova-demo-export.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
if(a==='import')return document.getElementById('import-file')?.click();
if(a==='reset')return confirmAction('إعادة ضبط بيانات العرض','ستُستبدل تعديلات هذه الجلسة بالعينة التجريبية الأصلية. هل تريد المتابعة؟',()=>{db=initial();actor='u1';profile=null})});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='top-user'||x.id==='settings-user')return provider.auth.select(x.value);
if(x.dataset.filter){filters[x.dataset.filter]=x.value;leadPage=1;let focus=x.id;render();document.getElementById(focus)?.focus()}
if(x.id==='from'||x.id==='to'||x.id==='period-employee'){period[x.id==='period-employee'?'employee':x.id]=x.value;render()}
if(x.id==='audit-type')updateAudit();
if(x.id==='import-file'&&x.files[0]){let file=x.files[0];file.text().then(text=>{let obj;try{obj=JSON.parse(text)}catch{return toast('تعذر قراءة ملف JSON.',true)}confirmAction('تأكيد الاستيراد','سيستبدل الاستيراد بيانات هذه الجلسة. راجع الملف قبل المتابعة.',()=>provider.transfer.import(obj))}).catch(()=>toast('تعذر قراءة الملف.',true))}});
document.addEventListener('input',e=>{if(e.target.id==='audit-query')updateAudit();if(['m-price','m-discount','m-paid'].includes(e.target.id)){let v=Number(document.getElementById('m-price')?.value||0)-Number(document.getElementById('m-discount')?.value||0)-Number(document.getElementById('m-paid')?.value||0);document.getElementById('balance-preview').textContent=money(v)}});
function updateAudit(){let q=document.getElementById('audit-query')?.value.toLowerCase()||'',type=document.getElementById('audit-type')?.value||'';let target=document.getElementById('audit-table');if(target)target.innerHTML=auditTable(provider.audit.read().filter(a=>(!type||a.type===type)&&(!q||(a.action+a.change+a.record).toLowerCase().includes(q))))}
document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){filters.q=e.target.value;leadPage=1;setPage(1)}});
render();
</script>
 
</body></html>
